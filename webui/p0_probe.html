<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>P0 — thăm dò đường ống</title>
<style>
  :root{
    --bg:#202020; --surface:#2b2b2b; --field:#2d2d2d; --raised:#383838;
    --border:#3f3f3f; --text:#e8e8e8; --muted:#9a9a9a; --dim:#7a7a7a;
    --ok:#4ec96a; --err:#e5534b; --warn:#d9a441; --accent:#ffa657;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px}
  h1{font-size:17px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;
        padding:14px 16px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);
           text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:3px 0;vertical-align:top}
  td:first-child{color:var(--muted);width:190px;white-space:nowrap}
  code{font:12px/1.5 Consolas,monospace;color:var(--accent)}
  button{background:var(--raised);color:var(--text);border:1px solid var(--border);
         border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;
         margin-right:8px;transition:background .12s,border-color .12s}
  button:hover{background:#454545;border-color:#555}
  button:active{background:#333}
  .ok{color:var(--ok)} .err{color:var(--err)} .dim{color:var(--dim)}
  #ketqua{font:12px/1.6 Consolas,monospace;white-space:pre-wrap;
          background:var(--field);border:1px solid var(--border);border-radius:6px;
          padding:10px;margin-top:10px;min-height:52px;color:var(--muted)}
</style>
</head>
<body>

<h1>P0 — thăm dò đường ống</h1>
<div class="sub">Web → <code>api.py</code> → <code>core.py</code>, và Web → <code>overlays.py</code> (tiến trình con)</div>

<div class="card">
  <h2>Trạng thái nền tảng</h2>
  <table id="bang"><tr><td class="dim">đang gọi bootstrap…</td></tr></table>
</div>

<div class="card">
  <h2>Thử đường ống</h2>
  <button onclick="thuMods()">Nạp danh sách mod</button>
  <button onclick="thuValidate()">Kiểm tra Process rỗng</button>
  <button onclick="thuTemplates()">Liệt kê template</button>
  <button onclick="thuChonDiem()">🎯 Chọn điểm (overlay tkinter)</button>
  <div id="ketqua">chưa chạy gì</div>
</div>

<script>
const $ = s => document.querySelector(s);
const api = () => window.pywebview.api;
function hien(x){ $('#ketqua').textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2); }

async function bootstrap(){
  const t0 = performance.now();
  const r = await api().bootstrap();
  const ms = Math.round(performance.now() - t0);
  if(!r.ok){ $('#bang').innerHTML = `<tr><td class="err">bootstrap hỏng</td><td>${r.error}</td></tr>`; return; }
  const v = r.value;
  const dong = [
    ['thời gian gọi', `${ms} ms`],
    ['loại hành động', `${v.action_types.length} — ${v.action_types.join(', ')}`],
    ['loại template', v.template_kinds.join(' · ')],
    ['màn hình ảo', v.screen.join(', ')],
    ['pyperclip (đọc item)', v.has_clip ? '<span class="ok">có</span>' : '<span class="err">thiếu</span>'],
    ['chụp màn hình', v.has_screen ? '<span class="ok">có</span>' : '<span class="err">thiếu</span>'],
    ['OCR (Abyss)', v.has_ocr ? '<span class="ok">có</span>' : `<span class="err">${v.ocr_reason||'thiếu'}</span>`],
    ['thư mục app', `<code>${v.app_dir}</code>`],
  ];
  $('#bang').innerHTML = dong.map(([k,x]) => `<tr><td>${k}</td><td>${x}</td></tr>`).join('');
}

async function thuMods(){
  hien('đang nạp…');
  const t0 = performance.now();
  const r = await api().get_mods();
  const ms = Math.round(performance.now() - t0);
  if(!r.ok) return hien(r);
  hien(`game=${r.game}  ·  ${r.so_luong} mod  ·  ${ms} ms qua cầu nối\n\n`
       + r.value.slice(0,5).map((m,i)=>`${i+1}. ${m}`).join('\n') + '\n…');
}
async function thuValidate(){ hien(await api().validate([])); }
async function thuTemplates(){ hien(await api().list_templates('process')); }
async function thuChonDiem(){
  hien('overlay đang mở — di chuột rồi Click / Enter, hoặc Esc để huỷ…');
  hien(await api().pick_point());
}

// Không dựa vào sự kiện 'pywebviewready': nếu nó bắn TRƯỚC khi script này chạy
// thì listener gắn sau sẽ không bao giờ nhận được.
(function cho(){ window.pywebview?.api ? bootstrap() : setTimeout(cho, 50); })();
</script>
</body>
</html>
